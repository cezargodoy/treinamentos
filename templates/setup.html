<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuração inicial | Gertec Academy</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-page"><main class="auth-shell"><section class="auth-card"><div class="auth-brand"><div class="brand-mark">G</div><div><strong>GERTEC <span>ACADEMY</span></strong><small>CONFIGURAÇÃO INICIAL</small></div></div><div class="auth-intro"><h1>Criar administrador</h1><p>Cadastre a primeira conta para administrar usuários, cursos e campanhas.</p></div>{% if message %}<div class="auth-alert">{{ message }}</div>{% endif %}<form method="post" action="/setup" class="auth-form"><label>Nome completo<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Senha (mínimo 12 caracteres)<input type="password" name="password" minlength="12" required></label><button class="btn auth-submit">Criar conta administradora</button></form><p class="auth-foot"><a href="/login">Voltar ao login</a></p></section></main></body></html>
