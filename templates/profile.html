{% extends 'base.html' %}{% block content %}<div class="heading"><div><span class="eyebrow">MINHA CONTA</span><h1>Meu perfil</h1><p>Atualize sua foto e consulte seus dados.</p></div></div><section class="card profile-edit">{% if user.photo_path %}<img src="{{user.photo_path}}" class="profile-photo">{% else %}<span class="avatar huge">{{user.name[:1]}}</span>{% endif %}<div><h2>{{user.name}}</h2><p>{{user.email}} · {{user.department or 'Gertec'}}</p><form method="post" action="/profile/photo" enctype="multipart/form-data"><label>Alterar foto de perfil<input type="file" name="photo" accept="image/png,image/jpeg,image/webp" required></label><p class="hint">JPG, PNG ou WebP · máximo de 3 MB.</p><button class="btn">Salvar foto</button></form></div></section>{% endblock %}
