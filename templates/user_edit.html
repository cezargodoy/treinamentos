{% extends 'base.html' %}{% block content %}<div class="heading"><div><span class="eyebrow">CONFIGURAÇÃO ADMINISTRATIVA</span><h1>Editar usuário</h1><p>Somente o administrador pode alterar configurações de contas.</p></div><a class="btn secondary" href="/admin/users">Voltar</a></div>{% if message %}<div class="callout">{{message}}</div>{% endif %}<section class="card"><form method="post" action="/admin/users/{{item.id}}/edit" class="form"><label>Nome completo<input name="name" value="{{item.name}}" required></label><label>E-mail<input name="email" type="email" value="{{item.email}}" required></label><label>Departamento<input name="department" value="{{item.department}}"></label><label>Perfil<select name="role">{% for r in ['admin','rh','gestor','colaborador'] %}<option value="{{r}}" {% if item.role==r %}selected{% endif %}>{{r|capitalize}}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="active" {% if item.active %}checked{% endif %}> Usuário ativo</label><label>Nova senha (opcional)<input type="password" name="new_password" minlength="12" placeholder="Deixe em branco para manter"></label><div class="full"><button class="btn">Salvar alterações</button></div></form></section>{% endblock %}
