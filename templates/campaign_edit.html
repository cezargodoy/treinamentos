{% extends "base.html" %}{% block content %}<div class="heading"><div><span class="eyebrow">CONFIGURAÇÃO ADMINISTRATIVA</span><h1>Editar campanha</h1><p>Revise os dados, os públicos e os treinamentos associados.</p></div><a class="btn secondary" href="/campaigns">Voltar</a></div><section class="card"><form method="post" action="/campaigns/{{campaign.id}}/edit" class="form"><label>Nome<input name="title" value="{{campaign.title}}" required></label><label>Data limite<input type="date" name="due_date" value="{{campaign.due_date}}"></label><label class="full">Descrição<textarea name="description">{{campaign.description}}</textarea></label><label class="check"><input type="checkbox" name="active" {% if campaign.active %}checked{% endif %}> Campanha ativa</label><div class="full"><b>Perfis direcionados</b>{% for r in roles %}<label class="check"><input type="checkbox" name="roles" value="{{r}}" {% if r in selected_roles %}checked{% endif %}> {{r|capitalize}}</label>{% endfor %}</div><div class="full"><b>Cursos</b>{% for c in courses %}<label class="check"><input type="checkbox" name="course_ids" value="{{c.id}}" {% if c.id in selected_courses %}checked{% endif %}> {{c.title}}</label>{% endfor %}</div><div class="full"><button class="btn">Salvar configurações</button></div></form></section>{% endblock %}
